# Training Configuration for MicroBias Watermarker (Optimized for macOS M3)
# Lightweight & Safe setup for Apple Silicon (MPS backend, no CUDA/xFormers)

# ===========================
# Model Configuration
# ===========================
model_name: "runwayml/stable-diffusion-v1-5"   # Base SD model
resolution: 512
gradient_checkpointing: true
memory_efficient_attention: false  # ❌ Disabled (xFormers not supported on M3)

# ===========================
# LoRA Configuration
# ===========================
lora_rank: 4         # 🔽 smaller rank = less memory
lora_alpha: 8         # 🔽 scaled down for smaller LoRA weights
lora_dropout: 0.1
target_modules:
  - "to_k"
  - "to_q"
  - "to_v"
  - "to_out.0"

# ===========================
# Training Hyperparameters
# ===========================
learning_rate: 1e-4     # Reduced for stable updates on small batches
batch_size: 1           # ✅ Best for 8–16GB M3 unified memory
num_epochs: 2           # 🔽 Short warm-up training
gradient_accumulation_steps: 1
max_grad_norm: 0.5

# ===========================
# Optimizer Settings
# ===========================
adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 1e-2
adam_epsilon: 1e-08

# ===========================
# LR Scheduler
# ===========================
lr_scheduler: "linear"
lr_warmup_steps: 100
lr_num_cycles: 1
lr_power: 1.0

# ===========================
# Steganographic Loss
# ===========================
stego_loss_weight: 0.2     # Slightly higher to emphasize watermark accuracy
bit_strength: 0.01
quality: 75

# ===========================
# Dataset Settings
# ===========================
data_path: "data/training"
use_synthetic_data: true   # ✅ For fast testing without heavy dataset
num_synthetic_samples: 100 # ⚡ Quick prototype
seed: 42
num_workers: 0             # ✅ Prevent multiprocessing issues on MPS
center_crop: true
random_flip: false
pin_memory: false

# ===========================
# Hugging Face Dataset (optional)
# ===========================
hf_dataset_name: null
hf_dataset_split: "train"
hf_dataset_config: null
local_metadata_file: null

# ===========================
# Monitoring & Logging
# ===========================
output_dir: "outputs/macos_run"
save_every: 1
visualize_every: 1
show_progress: true
use_wandb: false
wandb_project: "microbias-watermarker"
run_name: "lora-bias-macos"

# ===========================
# Evaluation
# ===========================
eval_every: 1
num_eval_samples: 10

# ===========================
# Precision & Hardware
# ===========================
device: "mps"               # ✅ Apple Metal backend
precision: "32"             # ✅ No mixed precision (MPS doesn’t support fp16 well)
torch_dtype: "float32"      # ✅ Safe dtype for Apple GPU
mixed_precision: "no"       # Avoid AMP crashes on MPS
allow_tf32: false
cpu_offload: false
sequential_cpu_offload: false

# ===========================
# Performance / Memory
# ===========================
gradient_checkpointing_kwargs:
  use_reentrant: false
early_stopping: false
save_total_limit: 3
checkpointing_steps: 500
resume_from_checkpoint: null

# ===========================
# Validation & Preprocessing
# ===========================
validation_split: 0.1
test_split: 0.1
max_train_samples: 100
max_eval_samples: 20
image_mean: [0.5, 0.5, 0.5]
image_std: [0.5, 0.5, 0.5]
image_column: "image"
caption_column: "prompt"
bias_column: "bias"

# ===========================
# Generation Settings (for evaluation)
# ===========================
num_inference_steps: 25   # 🔽 Half steps for faster preview
guidance_scale: 6.0
eta: 0.0
num_images_per_prompt: 1
generator_seed: 42

# ===========================
# Misc
# ===========================
log_level: "info"
project_name: "microbias-watermarker"
experiment_name: "lora-macos-run"
tags: ["stable-diffusion", "lora", "macos", "mps"]
notes: "Mac-optimized run for MicroBias LoRA fine-tuning using float32 on MPS."
set_seed: true
